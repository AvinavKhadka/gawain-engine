name: ⬢ Gawain Engine — CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  # 🎨 Frontend — TypeScript + Arasaka theme build
  frontend:
    name: 🎨 Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install deps
        run: npm ci

      - name: 🔍 TypeScript check (no emit)
        run: npx tsc -b --force

      - name: 🧹 ESLint
        run: npx eslint src --ext .ts,.tsx || echo "⚠️ ESLint warnings"

      - name: 🏗️ Build Arasaka theme
        run: npm run build

      - name: 📤 Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: arasaka-static
          path: static/
          retention-days: 3

  # 🐍 Backend — Python syntax + import check
  backend:
    name: 🐍 Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: 🧹 Flake8 (light)
        run: flake8 server/ config/ main.py --max-line-length=120 --exclude=__pycache__ || true

      - name: 🔍 Compile check
        run: python -m py_compile main.py server/*.py config/*.py

  # 🐳 Docker — Build image (no push) + healthcheck
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build image (no push, with cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: arasaka-gawain:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build args if needed
          # build-args: |
          #   NODE_ENV=production

      - name: ✅ Smoke test — docker compose config
        run: docker compose config

  # 🚀 Optional: Push to GHCR on main push (if you set DOCKERHUB or GHCR secrets)
  # Uncomment to enable auto-publish
  docker-publish:
    name: 🚀 Publish to GHCR (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: 🐳 Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
